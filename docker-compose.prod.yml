# Saiva — production deploy using prebuilt images from GHCR (no local build).
#   cp .env.example .env  &&  edit .env
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#   (or simply: make pull)
#
# Pin a version with SAIVA_VERSION (default: latest). Forks can repoint the images
# with SAIVA_REGISTRY (default: ghcr.io/marioalfaro75). SAIVA_API_IMAGE /
# SAIVA_WEB_IMAGE override the whole reference and are what a rollback writes: a digest,
# because `latest` is not something you can go back to -- by the time you want to, it
# already points at the release you are rolling back from.
#
# Updates are applied by scripts/deploy.sh --apply-release, which is the ONE path `make
# update` and the in-app button both take. Nothing in this file updates anything: there
# is no Watchtower here any more, and no Docker socket on the box at all. The button
# writes a file; a small root-owned agent on the host (scripts/saiva-update-agent) sees
# it and runs that one script. See docs/UPDATING.md.
name: saiva

services:
  db:
    # A floating tag bounded to a major, deliberately. `postgres:16-alpine` is rebuilt
    # by its publisher with OS patches and can never cross into 17, so the data
    # directory stays compatible -- and now that the release path runs `compose pull`
    # for every service rather than for two labelled ones, those patches actually reach
    # this box. Reproducibility comes from the other direction: the deploy records the
    # resolved digest of every service before it changes anything, and a rollback pins
    # all four back by digest. Set SAIVA_DB_IMAGE to hold this still by hand.
    image: ${SAIVA_DB_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saiva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saiva}
      POSTGRES_DB: ${POSTGRES_DB:-saiva}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saiva} -d ${POSTGRES_DB:-saiva}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ${SAIVA_API_IMAGE:-${SAIVA_REGISTRY:-ghcr.io/marioalfaro75}/saiva-api:${SAIVA_VERSION:-latest}}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saiva}:${POSTGRES_PASSWORD:-saiva}@db:5432/${POSTGRES_DB:-saiva}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Caddy is the only thing that can reach the API (it is `expose`d, not
      # published), so its X-Forwarded-For is worth believing. Without this the
      # rate limiter and the audit log both see Caddy's container IP and nothing
      # else — one shared bucket for every visitor, and a useless audit trail.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-caddy}
      # Where the in-app button drops its request, and where it reads the updater's
      # status back from. A directory, not a socket and not the Docker API: the most the
      # api container can do here is ask for the update the button was going to do
      # anyway. See the volume below.
      SAIVA_UPDATE_DIR: /run/saiva-update
      # How old the newest VERIFIED backup may be before Settings stops calling it
      # current. It has to be passed explicitly: there is no `env_file:` on any service
      # and the image carries no .env, so a setting the owner writes in .env reaches the
      # api container only if it is listed here. It was not, so the policy had no effect
      # whatever and the page silently used the code default.
      SAIVA_BACKUP_STALE_HOURS: ${SAIVA_BACKUP_STALE_HOURS:-36}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - db_backups:/backups
      # The update channel, as TWO mounts, and that split is the security boundary.
      #
      # Read-only on the directory, read-write on the drop-box inside it. Giving the
      # container the whole directory was reviewed and broken end to end: owning a
      # directory means being able to unlink and rename root-owned entries inside it, so
      # the container could point root's deploy.lock and run.log at any file on the host
      # (shell redirections follow symlinks), point run.log at a file it wanted read back
      # through the status API, and substitute its own records/ so a rollback restored
      # its .env and pinned its images.
      #
      # Now it reads status.json and writes one uniquely-named file into requests/. Root
      # never opens anything in there -- the agent asks `find -type f`, which does not
      # follow symlinks, and unlinks what it finds.
      #
      # THE SECOND DROP-BOX is how "Back up now" is told apart from "Update now" without
      # root ever reading a byte the container wrote. The DIRECTORY carries the one bit of
      # information, and each has its own systemd path unit. Encoding it in the request's
      # name or contents instead would hand that bit to a process on the network, and the
      # whole argument above rests on root never consulting one.
      - ${SAIVA_STATE_DIR:-/var/lib/saiva/update}:/run/saiva-update:ro
      - ${SAIVA_STATE_DIR:-/var/lib/saiva/update}/requests:/run/saiva-update/requests
      - ${SAIVA_STATE_DIR:-/var/lib/saiva/update}/backup-requests:/run/saiva-update/backup-requests

  web:
    image: ${SAIVA_WEB_IMAGE:-${SAIVA_REGISTRY:-ghcr.io/marioalfaro75}/saiva-web:${SAIVA_VERSION:-latest}}
    restart: unless-stopped
    expose:
      - "8080"

  caddy:
    image: ${SAIVA_CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      - api
      - web
    environment:
      SAIVA_SITE_ADDRESS: ${SAIVA_SITE_ADDRESS:-localhost}
      SAIVA_SITE_HOST: ${SAIVA_SITE_HOST:-localhost}
      SAIVA_TLS: ${SAIVA_TLS:-internal}
      # 0 unless a publicly trusted certificate is in use — see infra/Caddyfile.
      SAIVA_HSTS_MAX_AGE: ${SAIVA_HSTS_MAX_AGE:-0}
    # Bound to the loopback address unless a site address was chosen, because Docker
    # publishes on 0.0.0.0 by default and inserts NAT rules that bypass the host
    # firewall. Caddy routes on the Host header, not on the listening address, so a
    # default "localhost" install was reachable from the whole LAN by anyone sending
    # Host: localhost — while the README promised it was confined to this machine.
    ports:
      - "${SAIVA_BIND_ADDR:-127.0.0.1}:80:80"
      - "${SAIVA_BIND_ADDR:-127.0.0.1}:443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      # Read-only, and the reason it is here is the one thing the old design could never
      # do: say what happened when the api container is the thing that is broken. Caddy
      # serves status-public.json straight off the host, so the panel can still report
      # "failed at the gate, rolled back" with api down. The file is written by the
      # updater on the host, so even Caddy being recreated is a gap in the transport,
      # not a loss of the answer.
      - ${SAIVA_STATE_DIR:-/var/lib/saiva/update}:/srv/saiva-update:ro
      - caddy_data:/data
      - caddy_config:/config

  # There is deliberately no updater service here any more, and no Docker socket on
  # this box at all.
  #
  # What used to be here: Watchtower behind a filtering socket proxy, triggered by the
  # api container over a shared token. It worked, as far as it went, and that was the
  # problem -- it went three-eighths of the way. Watchtower never reads a compose file;
  # it recreates a container from the OLD container's own inspect output, so no compose
  # change, no .env value, no port binding and no Caddyfile edit could ever reach this
  # box through it. It also treats a container that merely STARTS as a successful
  # update, so there was no gate and nothing to roll back to.
  #
  # And the proxy's own comment said the quiet part: updating a container means creating
  # one, and anything that can create a container can create a privileged one and own
  # the host. That access existed so a button could pull two images.
  #
  # What replaces it: scripts/deploy.sh --apply-release on the host -- images, compose
  # file, Caddyfile, .env, every service -- gated on the published address answering
  # from outside, rolled back if it does not. The button writes a file into the volume
  # mounted on `api` above; a root-owned oneshot (scripts/saiva-update-agent, installed
  # by scripts/install-updater.sh) sees it and runs that script with no arguments. The
  # agent resolves the target release itself, so the most a compromised api container
  # can ask for is the update the button was going to do anyway.
  #
  # The result is one fewer moving part, two fewer services, no shared update token, and
  # no path from a network-facing container to the Docker daemon.

volumes:
  db_data:
  db_backups:
  caddy_data:
  caddy_config:
