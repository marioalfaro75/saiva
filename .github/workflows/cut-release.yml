name: Cut release

# Manually cut a versioned release from the current default branch. It builds and
# publishes the images first, then creates the tag + GitHub Release — so a release
# never exists without its images.
#
# This used to claim that `:latest` could not drift from `:v<ver>`, and since
# refresh-images.yml it is no longer true, so here is what is: `v<ver>` and
# `sha-<sha>` are written here and never again, while `latest` and `<major.minor>`
# are rolling pointers that a refresh moves to a rebuilt digest of this same tree.
# `:latest` is therefore "the newest build of the newest release", not "the same
# image as `:v<ver>`". If you want one exact image — which is what the documented
# rollback wants — pin SAIVA_VERSION to `v<ver>` or `sha-<sha>`.
#
# "Written here and never again" holds for this path. The one way those immutable
# tags move is somebody pushing a `v*` tag by hand, which fires release.yml and
# rebuilds the same names from whatever that tag points at. All three writers of the
# release channel now share the concurrency group below, so they cannot interleave,
# but nothing stops that rebuild — don't hand-push version tags, use this workflow.
# Trigger: Actions → "Cut release" → Run workflow (enter a version like 0.8.2), or
# via the API. Tags created here use GITHUB_TOKEN, so they do not re-trigger the
# tag-push build in release.yml (no double build).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.8.2 (the 'v' prefix is added automatically)"
        required: true
      notes:
        description: "Release notes (Markdown). Leave blank to auto-generate from merged PRs."
        required: false
        default: ""

permissions:
  contents: read

# Shared with refresh-images.yml, which writes the same `:latest`. Without it, a
# refresh of v0.16.0 finishing after a release of v0.17.0 walks `:latest` backwards.
# Never cancel a release in flight: its images are already published by the time the
# tag is created, and a cancelled run leaves the two out of step.
concurrency:
  group: ghcr-release-channel
  cancel-in-progress: false

jobs:
  prep:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      major_minor: ${{ steps.v.outputs.major_minor }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Normalise version and ensure the tag is new
        id: v
        env:
          RAW_VERSION: ${{ github.event.inputs.version }}
        run: |
          ver="${RAW_VERSION#v}"
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be X.Y.Z (got '$RAW_VERSION')"
            exit 1
          fi
          tag="v$ver"
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists"
            exit 1
          fi
          {
            echo "version=$ver"
            echo "tag=$tag"
            echo "major_minor=$(printf '%s' "$ver" | cut -d. -f1-2)"
          } >> "$GITHUB_OUTPUT"

  # Dispatch can be pointed at any ref, so "it came from main and main is green"
  # is not something this workflow gets to assume.
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  images:
    name: Publish ${{ matrix.image }}
    needs: [prep, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: saiva-api, context: ./backend }
          - { image: saiva-web, context: ./frontend }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.prep.outputs.tag }}
            type=raw,value=${{ needs.prep.outputs.major_minor }}
            type=raw,value=latest
            type=sha
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          build-args: |
            SAIVA_VERSION=${{ needs.prep.outputs.version }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Tag + GitHub Release
    needs: [prep, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Create tag and release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prep.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prep.outputs.tag }}
          body: ${{ github.event.inputs.notes }}
          generate_release_notes: ${{ github.event.inputs.notes == '' }}
          make_latest: 'true'
