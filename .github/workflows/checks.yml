name: Checks

# The single definition of "is this commit good enough to ship". Called by ci.yml
# on every push/PR, and by both release paths before they publish an image — a
# `v*` tag used to reach `:latest` without running a single test, so the release
# and the edge channel now clear the same bar.
on:
  workflow_call:
    inputs:
      ref:
        # Blank means "the ref that triggered the caller", which is what every caller
        # but refresh-images.yml wants and is exactly what actions/checkout does with
        # an unset `ref` — its own default is the empty string and the fallback to
        # github.context.ref happens on any falsy value, so passing "" through is
        # bit-for-bit the same as omitting it.
        #
        # refresh-images.yml needs the other behaviour: it rebuilds a release *tag*
        # on a schedule, and a local `uses: ./...` is always resolved from the
        # caller's commit and accepts no `@ref`. Without this input the checks here
        # would run against the default branch while the images were built from the
        # tag — a gate describing a different tree from the artifact it admits.
        description: "Commit, branch or tag to check (blank = the caller's own ref)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests, SAST)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy app
      - name: Tests + coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: SAST (bandit)
        run: bandit -r app -q --skip B101,B105,B311
      - name: Runtime lockfile still matches pyproject
        run: python ../scripts/check_lockfile.py
      - name: Dependency audit (pip-audit)
        # Blocking. This was `|| true` for a long stretch, which meant the audit
        # ran, found things, printed them green and shipped anyway.
        run: pip-audit --strict --requirement requirements.lock

  migrations:
    name: Migrations (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saiva
          POSTGRES_PASSWORD: saiva
          POSTGRES_DB: saiva
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U saiva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://saiva:saiva@localhost:5432/saiva
      SECRET_KEY: ci-not-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Apply migrations (must succeed on Postgres)
        run: alembic upgrade head
      - name: Check migrations match models (no drift)
        run: alembic check
      - name: An image rolled back onto a newer schema must serve, not crash-loop
        # The job that did not exist, and the one whose absence meant the retained-image
        # rollback was never going to work. It boots this image's start-up migration
        # against a database at a revision the image has never heard of -- which is
        # exactly what an image rollback is -- and asserts it serves, writes no dump and
        # changes nothing. Before this, that path raised CommandError, uvicorn never ran
        # because the container's CMD chains them with `&&`, and `restart:
        # unless-stopped` looped forever while writing a full copy of the database on
        # every attempt.
        #
        # It needs real Postgres: the backup branch is guarded on the dialect, and the
        # dump amplification is the whole point. On SQLite it would prove nothing.
        env:
          SAIVA_TEST_PG_URL: postgresql+psycopg://saiva:saiva@localhost:5432/postgres
        run: pytest tests/test_schema_rollback.py -v
      - name: Migrations stay expand-only
        # The guarantee above is only safe to promise while new migrations keep adding
        # rather than removing. This enforces the 12-for-12 habit the repository already
        # had, so it cannot quietly stop being true.
        run: pytest tests/test_migrations_expand_only.py -v

  deploy-scripts:
    name: Deploy path (shell, fake docker)
    runs-on: ubuntu-latest
    # The restore rehearsal below needs a real Postgres: the dumps are plain SQL replayed
    # with psql, and the whole point of the test is that the round trip actually works.
    # An earlier version of this job ran that step with no database at all, so it failed
    # on every run -- which is worse than not running it, because a step that is always
    # red stops being read.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saiva
          POSTGRES_PASSWORD: saiva
          POSTGRES_DB: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U saiva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # The release path does `git fetch --tags` and `git checkout --detach`, and the
          # tests build their own origin out of this checkout, so a shallow clone with no
          # history makes them fail for the wrong reason.
          fetch-depth: 0
      - name: Shell syntax
        run: |
          for f in scripts/*.sh scripts/lib/*.sh scripts/saiva-update-agent scripts/tests/run.sh; do
            bash -n "$f" || exit 1
          done
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh scripts/lib/*.sh scripts/saiva-update-agent
      - name: Deploy state machine (fake docker, fake curl)
        # Gate, rollback, re-exec, .env idempotence and the downgrade refusal, none of
        # which needs a daemon. What it cannot cover -- whether a real `compose up`
        # produces a working stack -- is what image-smoke.yml is for.
        run: ./scripts/tests/run.sh
      - name: A bare deploy must not rewrite .env
        # Spelled out as its own step because this one defect took the production site
        # off the LAN, and a line in a 22-test summary is easy to miss.
        run: ./scripts/tests/run.sh env_is_byte_identical
      - name: Postgres client tools
        # psql, pg_dump and gunzip are what restore-backup.sh --direct actually runs; the
        # server is the service above. The client must match the server major or pg_dump
        # refuses the version it finds.
        run: sudo apt-get install -y -qq postgresql-client-16 || sudo apt-get install -y -qq postgresql-client
      - name: Restore from a dump, against real Postgres
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: saiva
          PGPASSWORD: saiva
        run: ./scripts/tests/test-restore-backup.sh

  frontend:
    name: Frontend (lint, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Type-check + build
        run: npm run build
      - name: Tests (vitest)
        run: npm run test
      - name: Dependency audit (npm)
        run: npm audit --audit-level=high

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
