name: Refresh release images

# Rebuild the *current release* so OS security patches reach the box without anyone
# cutting a version.
#
# The problem this solves: production follows `:latest` (SAIVA_VERSION defaults to
# it in docker-compose.prod.yml) and `:latest` is only ever written by a human
# running cut-release.yml. The last two releases were 57 days apart, so for most of
# any given month a Debian or Alpine advisory against python:3.11-slim-bookworm,
# caddy:2-alpine or libpq5 has no route to the box at all — the weekly image scan in
# security-scan.yml finds it and then nothing happens. Dependabot's base-image
# ignore rules deliberately leave that job as the only watcher, which makes "nothing
# happens" the whole of the response.
#
# What it deliberately does NOT do: rebuild `main`. Rebuilding the default branch
# and publishing it as `:latest` is continuous deployment of unreleased code, which
# is a different (and much larger) decision than "let OS patches through". This
# rebuilds the tree of the highest released version, so the only thing that can
# change is a base-image layer, an apt/apk package, or the frontend's npm install —
# never application code.
#
# Know what the ceiling is. Debian handed bookworm to the LTS team in mid-2026
# (wiki.debian.org/LTS/Bookworm opens the LTS period on 2026-06-11; the handover was
# announced on 2026-07-12 alongside the final point release 12.15 — the exact day is
# not worth asserting here, only that it has passed). LTS coverage is narrower than
# regular support, so for part of what the API image carries "no fix available" now
# means "will not be fixed", and rebuilding cannot deliver a patch nobody published. This workflow
# shortens the gap between a fix existing and it reaching the box; it does not
# create fixes. When the unfixed count stops falling, the answer is a new base
# image, which is a code change and therefore a release — see
# backend/tests/test_runtime_support_window.py for the calendar that says when.
#
# What it also does not do: *deliver* the patch. Nothing on the box polls (there is
# no WATCHTOWER_SCHEDULE and WATCHTOWER_HTTP_API_PERIODIC_POLLS defaults to false),
# and the in-app update badge compares GitHub *release tags* — see
# backend/app/services/updates.py, `is_newer` — so republishing v0.16.0 under the
# same tag raises no badge. Be precise about what that means for the owner, because
# it is easy to get wrong: `update_available` stays false, and
# frontend/src/components/UpdatesPanel.tsx renders "Update now" only when
# `update_available && apply_available` — so after a refresh there is no button to
# press, and the panel affirmatively reads "You're on the latest version" while the
# box runs the unpatched digest. The only delivery route is `make pull` (or
# `docker compose -f docker-compose.prod.yml pull && … up -d`). Do not write "press
# Update now" anywhere in this file; it is an instruction nobody can follow.
#
# One thing has changed since that was written, and only one. The refreshed image now
# bakes SAIVA_BUILD=<tag>-patch.<date> — the same name the promote job writes — so a box
# can say which rebuild it is running rather than only which release, which makes "did
# the patch actually land here" answerable from /api/health instead of by comparing
# digests by hand. It raises no badge and it pulls nothing.
#
# That the last step is a human's is on purpose — this box has no health-gated
# rollback, Watchtower counts a container that merely starts as a success — but the
# cost is real: a refresh that nobody pulls has patched nothing.
#
# Run it once by hand from the Actions tab before trusting the schedule. Everything
# below the build is shell that cannot be exercised anywhere but a real runner.
on:
  schedule:
    # Tuesdays, the morning after security-scan.yml's weekly run (Mondays 06:27
    # UTC): the owner has already seen what the scan found when the refresh that
    # would fix it goes out.
    - cron: "41 4 * * 2"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild, e.g. v0.16.0 (blank = the highest released version)"
        required: false
        default: ""

permissions:
  contents: read

# `:latest` has two writers and both share this group: this workflow and
# cut-release.yml. There used to be a third. release.yml published `:latest` from any
# `v*` tag push without ever naming it — docker/metadata-action generates it by default
# in `auto` mode for `type=semver` — and it had no concurrency group at all until this
# workflow existed. That path is retired: release.yml now refuses to publish and tells
# the pusher to run Cut release. Serialising the two that remain is what stops a refresh
# of v0.16.0 landing on top of a release of v0.17.0 and walking `:latest` backwards.
# Never cancel: a half-finished promote leaves api and web on different digests.
concurrency:
  group: ghcr-release-channel
  cancel-in-progress: false

jobs:
  discover:
    name: Find the release to rebuild
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      major_minor: ${{ steps.pick.outputs.major_minor }}
      sha: ${{ steps.pick.outputs.sha }}
      rebuild_tag: ${{ steps.pick.outputs.rebuild_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are the input to this whole workflow, and a shallow clone has none.
          fetch-depth: 0
      - name: Pick the highest released version
        id: pick
        env:
          REQUESTED: ${{ github.event.inputs.tag }}
          # For `gh release view` below. GITHUB_TOKEN with `contents: read` is enough
          # to read a Release; nothing here writes one.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A tag is released if it has a published, non-draft, non-prerelease GitHub
          # Release. That record is the thing a human made deliberately —
          # cut-release.yml creates it with `make_latest: 'true'` — and it is what
          # separates a version somebody cut from a tag somebody pushed. Reachability
          # is the wrong test: cut-release.yml says in its own comment that dispatch
          # can be pointed at any ref, so a legitimate release need not be an ancestor
          # of main. Needs no permission beyond `contents: read`.
          released_tag() {
            local json
            json="$(gh release view "$1" --json isDraft,isPrerelease 2>/dev/null)" || return 1
            [ "$(printf '%s' "$json" | jq -r '.isDraft')" = false ] \
              && [ "$(printf '%s' "$json" | jq -r '.isPrerelease')" = false ]
          }
          if [ -n "$REQUESTED" ]; then
            tag="$REQUESTED"
          else
            # Sorted by version, NOT `git describe`. describe answers "the nearest tag
            # reachable from HEAD", and cut-release.yml says in its own comment that
            # dispatch can be pointed at any ref — so a release cut from a side branch
            # produces a tag that main cannot reach, describe silently falls back to the
            # *previous* release, and this workflow would republish older application
            # code as `:latest`. That is a downgrade of a family's finance box, applied
            # unattended, and it would look like a successful run.
            #
            # The strict `vX.Y.Z` filter earns its place, but not by keeping a release
            # candidate out of production: `--sort=-v:refname` does rank `v0.16.0-rc1`
            # above `v0.16.0` (verified), and a glob like 'v[0-9]*.[0-9]*.[0-9]*' would
            # pick the rc — but the validation below is unconditional and would then
            # fail the run. What the filter buys is that the refresh keeps *working*
            # while a prerelease tag is the highest ref, instead of going red every
            # Tuesday until someone cuts the real version. The shape is exactly the one
            # cut-release.yml validates on input.
            #
            # The first line is taken with parameter expansion rather than `| head -1`
            # on purpose. `head` closes the pipe after one line and `grep` takes
            # SIGPIPE, which `pipefail` turns into a failed step. It survives today
            # only because few tags match; at ~1200 matching tags it exits 141
            # (measured). That is a bug that arrives with age, so it is avoided rather
            # than tolerated.
            released="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')"
            # Highest tag that is actually released, skipping ones that are not. A
            # hard failure on the first unreleased tag was the original shape here and
            # it is wrong: a single stray `v9.9.9` on a side branch sorts to the top
            # and would wedge the refresh every Tuesday until somebody noticed, so the
            # patches this workflow exists to deliver would quietly stop while the only
            # signal was a red scheduled run. Skipping is both safe and live — an
            # unreleased tag is never published either way.
            tag=""
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              if released_tag "$candidate"; then tag="$candidate"; break; fi
              echo "note: skipping $candidate — no published Release for it"
            done <<< "$released"
            if [ -z "$tag" ]; then
              echo "::error::no tag has a published Release, so there is nothing to"
              echo "::error::refresh. Cut a release first."
              exit 1
            fi
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$tag' is not a vX.Y.Z release tag"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag does not exist"
            exit 1
          fi
          # Re-checked unconditionally, which for the discovered tag is redundant and
          # for a dispatched one is the whole point: a hand-typed tag gets refused
          # rather than quietly replaced with a different release, because somebody
          # asking to rebuild v0.14.1 and silently getting v0.16.0 published as
          # `:latest` is the worst outcome available here.
          if ! released_tag "$tag"; then
            echo "::error::$tag has no published Release (or it is a draft or a"
            echo "::error::prerelease), so it is a tag somebody pushed rather than a"
            echo "::error::version somebody cut. Refusing to publish it as :latest."
            exit 1
          fi
          version="${tag#v}"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "major_minor=${version%.*}"
            echo "sha=$(git rev-parse "refs/tags/$tag^{commit}")"
            # Traceability: which day's base layers this is. A second run on the same
            # day overwrites it, which is the right outcome — it is a correction of
            # that day's refresh, not a new one.
            echo "rebuild_tag=$tag-patch.$(date -u +%Y%m%d)"
          } >> "$GITHUB_OUTPUT"
      - name: Say what will be rebuilt
        run: echo "Rebuilding ${{ steps.pick.outputs.tag }} (${{ steps.pick.outputs.sha }})"

  # The same bar cut-release.yml clears, run against the *released* tree rather than
  # whatever main holds today — that is what the `ref` input added to checks.yml is
  # for. A local `uses: ./...` is always resolved from the caller's commit and takes
  # no `@ref`, and actions/checkout inside a called workflow defaults to the caller's
  # event ref, so without that input a scheduled run would test main and ship a tag.
  #
  # Be honest about what this proves for an unchanged tree: almost nothing about the
  # new base layer. checks.yml runs pytest on a runner via setup-python and never
  # executes the built image. Its value here is the two time-varying gates —
  # `pip-audit --strict` over requirements.lock and `npm audit --audit-level=high` —
  # which will eventually go red on a frozen release, and that red is the correct
  # signal: the released tree no longer clears today's bar, so cut a release instead
  # of shipping a patched base under a stale lockfile. The evidence that the new base
  # layer is sound is in the jobs below, not here.
  checks:
    name: Checks
    needs: [discover]
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.discover.outputs.tag }}

  api:
    name: Rebuild + scan saiva-api
    needs: [discover, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    # No Postgres service here any more: it existed for the boot steps, and those are
    # now image-smoke.yml, which carries its own.
    env:
      IMAGE: saiva-api:candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.discover.outputs.tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both architectures, pushed once under a tag nothing deploys, and then tested
      # and promoted by digest. The alternative — build amd64 with `load: true`, test
      # it, then build again with `push: true` — publishes an amd64 image that is only
      # the one that was tested if the layer cache hit. Two builds mean two
      # resolutions of `FROM python:3.11-slim-bookworm`, and the whole premise of this
      # workflow is that that tag moves. Here the bytes that get promoted are the
      # bytes that were pulled and run.
      #
      # There is no cache-from/cache-to here, and the reason is narrower than it first
      # looks — state it accurately or the next reader will delete the guard. When the
      # base image HAS moved, a cache cannot make this a no-op: BuildKit pins the
      # resolved base digest into the FROM source op, so a new digest misses on the apt
      # layer and on everything after it. The case the cache would actually hide is the
      # complementary one: `python:3.11-slim-bookworm` unchanged, but PGDG or Debian
      # shipping a newer postgresql-client-16 or libpq5. This Dockerfile runs
      # `apt-get install` and never `apt-get upgrade`, so those few packages are
      # exactly what a replayed apt layer would freeze — and the run would be green,
      # the digest new, and the patch absent. `pull: true` covers the level above:
      # re-resolve the base tag rather than trust a local copy.
      # test_the_refresh_cannot_be_served_out_of_the_layer_cache keeps both honest.
      #
      # What this build does and does not prove, by architecture, because the asymmetry
      # is easy to forget once the job is green:
      #   linux/amd64  is built, pulled back and CVE-scanned here, then booted,
      #                health-checked through the image's own HEALTHCHECK, migrated and
      #                dumped by the `smoke` job below. That is the tested image.
      #   linux/arm64  is built under QEMU and gets only the in-image
      #                `RUN python -c "import app.main, app.dbinit"` from
      #                backend/Dockerfile. Nothing scans it and nothing runs it.
      # The promote step tags the whole index, so the arm64 half reaches `:latest` on
      # the evidence of an import alone. That is no worse than cut-release.yml, which
      # calls the same smoke workflow on the same single architecture — it is not
      # something either workflow fixes, and a box on arm64 is relying on a build-time
      # import.
      - name: Build both architectures and push the candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          # SAIVA_VERSION is the release identity, so it is the released version and
          # nothing else: the app compares it against GitHub Releases, and a refresh does
          # not change which release this is. SAIVA_BUILD is the immutable identity of
          # this exact build, and for a refresh that is `<tag>-patch.<date>` rather than
          # `sha-<short>` — the commit is the same as the release's, so `sha-` names the
          # ORIGINAL release build and the promote job below deliberately never moves it.
          # The rebuild tag is the only name that distinguishes this digest, and the
          # promote job publishes it, so it is a reference the owner can actually pull.
          build-args: |
            SAIVA_VERSION=${{ needs.discover.outputs.version }}
            SAIVA_BUILD=${{ needs.discover.outputs.rebuild_tag }}
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          # Keeps the pushed index a plain two-platform manifest list, which is what
          # the promote job copies with `imagetools create`.
          provenance: false
          # A tag nothing deploys; it exists so the manifest has a name, and is
          # overwritten by every run. The promote job never reads it.
          tags: ghcr.io/${{ github.repository_owner }}/saiva-api:refresh-candidate
          # Written out rather than taken from docker/metadata-action: on a scheduled
          # run that action reads github.ref, which is the default branch, and would
          # label this image with main instead of the release it is a rebuild of.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.discover.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.discover.outputs.sha }}
            org.saiva.image.rebuild=${{ needs.discover.outputs.rebuild_tag }}

      - name: Pull back the candidate this runner can actually execute
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ github.repository_owner }}/saiva-api@${{ steps.build.outputs.digest }}"
          # By digest, not by the candidate tag: nothing can have moved under us
          # between the push and here. The pull resolves the amd64 entry of the index.
          docker pull "$ref"
          docker tag "$ref" "$IMAGE"

      # Four steps where there used to be one, because run #1 proved the single step
      # wrong. It was named "must not be worse than the one it replaces" and implemented
      # as an ABSOLUTE threshold — exit-code 1 on any fixable CRITICAL/HIGH — on the
      # strength of saiva-api scanning 0 findings across 48 targets at the time. That
      # reasoning does not survive contact with either image:
      #
      #   * saiva-api rebuilt from v0.16.0 reported 7 HIGH, every one a pip/setuptools
      #     vendored CVE that the release genuinely shipped (jaraco.context 5.3.0,
      #     msgpack 1.1.2 x2, setuptools 70.3.0, urllib3 2.7.0 x2, wheel 0.45.1).
      #     `:latest` IS that release build, so it carries the same 7 — the rebuild is
      #     identical, not worse. The cure is a release containing the toolchain strip,
      #     which is what v0.16.1 is; it was never something a gate could deliver.
      #   * saiva-web reported 6 HIGH in usr/bin/caddy, four of them Go stdlib
      #     (CVE-2026-111943 crypto/x509, -78667, -78669, -97031). caddy:2-alpine has
      #     not been rebuilt against Go 1.26.10 upstream — projects needing that fix are
      #     compiling Caddy themselves on golang:1.26.10-alpine — so no rebuild here can
      #     cure them. This image never had a zero baseline to reason from at all.
      #
      # A gate that can only fail publishes nothing, which is worse than having no gate:
      # the patches this workflow exists to deliver simply stop arriving, silently, on a
      # schedule. So the question is now asked differentially, which is what the step
      # name always claimed — does the candidate carry a (package, vulnerability) pair
      # that the image it replaces does not? For a rebuild of unchanged source that is
      # the only question with a meaningful answer, and it is precisely the one that
      # catches a base image moving the wrong way.
      #
      # Why this is inline shell and not scripts/: every step above checked out the
      # RELEASE TAG, so a helper committed to main would not exist in an older tag's
      # tree. The workflow body comes from the dispatch ref instead, so logic that must
      # apply to every tag being rebuilt has to live here.
      - name: Findings in the rebuilt image, readable
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          image-ref: saiva-api:candidate
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Pull the image this one would replace
        run: |
          set -euo pipefail
          incumbent="ghcr.io/${{ github.repository_owner }}/saiva-api:latest"
          # The baseline is whatever `:latest` resolves to right now, because that is
          # literally the image this run would replace. A missing baseline is not a
          # reason to wave the candidate through: `:latest` exists after any release, so
          # its absence means something a human should look at.
          if ! docker pull -q "$incumbent"; then
            echo "::error::cannot pull $incumbent, so there is no baseline to compare"
            echo "::error::against. Refusing to publish rather than guessing."
            exit 1
          fi
          docker tag "$incumbent" saiva-api:incumbent

      # Both scans below run in this job, minutes apart, against the same Trivy DB. That
      # is what makes the comparison meaningful: scanning the two images at different
      # times would invent a "new" finding every time the database learned about an old
      # CVE, and the gate would fail for reasons that have nothing to do with the build.
      - name: Scan the candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          image-ref: saiva-api:candidate
          scanners: vuln
          format: json
          output: candidate.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Scan the image it would replace
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          image-ref: saiva-api:incumbent
          scanners: vuln
          format: json
          output: incumbent.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Refuse to publish anything the incumbent does not already carry
        run: |
          set -euo pipefail
          # Keyed on (package, vulnerability) and deliberately NOT on Trivy's Target
          # path. Target embeds the version — setuptools-79.0.1.dist-info/METADATA — so
          # keying on it would read every routine dependency bump as a brand-new finding
          # and fail the run for an upgrade.
          keys() {
            jq -r '[.Results[]? | .Vulnerabilities[]? | "\(.PkgName)\t\(.VulnerabilityID)"]
                   | unique | .[]' "$1" | sort -u
          }
          keys candidate.json > candidate.keys
          keys incumbent.json > incumbent.keys
          echo "candidate: $(wc -l < candidate.keys) fixable CRITICAL/HIGH"
          echo "incumbent: $(wc -l < incumbent.keys) fixable CRITICAL/HIGH"
          # comm needs both sides sorted, which `sort -u` above guarantees.
          introduced="$(comm -13 incumbent.keys candidate.keys)"
          cleared="$(comm -23 incumbent.keys candidate.keys)"
          if [ -n "$cleared" ]; then
            {
              echo "### saiva-api: cleared by this rebuild"
              printf '%s\n' "$cleared" | sed 's/^/ - /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$introduced" ]; then
            echo "::error::the rebuilt saiva-api carries findings the image it replaces"
            echo "::error::does not. The new base layer is worse than what the box runs;"
            echo "::error::not publishing it."
            printf '%s\n' "$introduced"
            exit 1
          fi
          echo "No finding in the candidate is absent from the image it replaces."

      # The boot steps that used to end this job are now image-smoke.yml, called by the
      # `smoke` job below and by cut-release.yml. They were the only thing in the
      # repository that executed a built image, and they ran here — weekly, against the
      # release tag — while the path that actually publishes a release ran none of them.

  web:
    name: Rebuild + scan saiva-web
    needs: [discover, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: saiva-web:candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.discover.outputs.tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Uncached and pulling fresh, for the reasons spelled out in the api job. This
      # image's two bases are node:22-alpine (build stage) and caddy:2-alpine, and
      # `npm install` resolving fresh is the point rather than a hazard: there is no
      # `npm ci` here, so a patched transitive dependency arrives the same way an
      # apk update does.
      - name: Build both architectures and push the candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          build-args: |
            SAIVA_VERSION=${{ needs.discover.outputs.version }}
            SAIVA_BUILD=${{ needs.discover.outputs.rebuild_tag }}
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/saiva-web:refresh-candidate
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.discover.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.discover.outputs.sha }}
            org.saiva.image.rebuild=${{ needs.discover.outputs.rebuild_tag }}
      - name: Pull back the candidate this runner can actually execute
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ github.repository_owner }}/saiva-web@${{ steps.build.outputs.digest }}"
          docker pull "$ref"
          docker tag "$ref" "$IMAGE"
      # Four steps where there used to be one, because run #1 proved the single step
      # wrong. It was named "must not be worse than the one it replaces" and implemented
      # as an ABSOLUTE threshold — exit-code 1 on any fixable CRITICAL/HIGH — on the
      # strength of saiva-api scanning 0 findings across 48 targets at the time. That
      # reasoning does not survive contact with either image:
      #
      #   * saiva-api rebuilt from v0.16.0 reported 7 HIGH, every one a pip/setuptools
      #     vendored CVE that the release genuinely shipped (jaraco.context 5.3.0,
      #     msgpack 1.1.2 x2, setuptools 70.3.0, urllib3 2.7.0 x2, wheel 0.45.1).
      #     `:latest` IS that release build, so it carries the same 7 — the rebuild is
      #     identical, not worse. The cure is a release containing the toolchain strip,
      #     which is what v0.16.1 is; it was never something a gate could deliver.
      #   * saiva-web reported 6 HIGH in usr/bin/caddy, four of them Go stdlib
      #     (CVE-2026-111943 crypto/x509, -78667, -78669, -97031). caddy:2-alpine has
      #     not been rebuilt against Go 1.26.10 upstream — projects needing that fix are
      #     compiling Caddy themselves on golang:1.26.10-alpine — so no rebuild here can
      #     cure them. This image never had a zero baseline to reason from at all.
      #
      # A gate that can only fail publishes nothing, which is worse than having no gate:
      # the patches this workflow exists to deliver simply stop arriving, silently, on a
      # schedule. So the question is now asked differentially, which is what the step
      # name always claimed — does the candidate carry a (package, vulnerability) pair
      # that the image it replaces does not? For a rebuild of unchanged source that is
      # the only question with a meaningful answer, and it is precisely the one that
      # catches a base image moving the wrong way.
      #
      # Why this is inline shell and not scripts/: every step above checked out the
      # RELEASE TAG, so a helper committed to main would not exist in an older tag's
      # tree. The workflow body comes from the dispatch ref instead, so logic that must
      # apply to every tag being rebuilt has to live here.
      - name: Findings in the rebuilt image, readable
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          image-ref: saiva-web:candidate
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Pull the image this one would replace
        run: |
          set -euo pipefail
          incumbent="ghcr.io/${{ github.repository_owner }}/saiva-web:latest"
          # The baseline is whatever `:latest` resolves to right now, because that is
          # literally the image this run would replace. A missing baseline is not a
          # reason to wave the candidate through: `:latest` exists after any release, so
          # its absence means something a human should look at.
          if ! docker pull -q "$incumbent"; then
            echo "::error::cannot pull $incumbent, so there is no baseline to compare"
            echo "::error::against. Refusing to publish rather than guessing."
            exit 1
          fi
          docker tag "$incumbent" saiva-web:incumbent

      # Both scans below run in this job, minutes apart, against the same Trivy DB. That
      # is what makes the comparison meaningful: scanning the two images at different
      # times would invent a "new" finding every time the database learned about an old
      # CVE, and the gate would fail for reasons that have nothing to do with the build.
      - name: Scan the candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          image-ref: saiva-web:candidate
          scanners: vuln
          format: json
          output: candidate.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Scan the image it would replace
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          image-ref: saiva-web:incumbent
          scanners: vuln
          format: json
          output: incumbent.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Refuse to publish anything the incumbent does not already carry
        run: |
          set -euo pipefail
          # Keyed on (package, vulnerability) and deliberately NOT on Trivy's Target
          # path. Target embeds the version — setuptools-79.0.1.dist-info/METADATA — so
          # keying on it would read every routine dependency bump as a brand-new finding
          # and fail the run for an upgrade.
          keys() {
            jq -r '[.Results[]? | .Vulnerabilities[]? | "\(.PkgName)\t\(.VulnerabilityID)"]
                   | unique | .[]' "$1" | sort -u
          }
          keys candidate.json > candidate.keys
          keys incumbent.json > incumbent.keys
          echo "candidate: $(wc -l < candidate.keys) fixable CRITICAL/HIGH"
          echo "incumbent: $(wc -l < incumbent.keys) fixable CRITICAL/HIGH"
          # comm needs both sides sorted, which `sort -u` above guarantees.
          introduced="$(comm -13 incumbent.keys candidate.keys)"
          cleared="$(comm -23 incumbent.keys candidate.keys)"
          if [ -n "$cleared" ]; then
            {
              echo "### saiva-web: cleared by this rebuild"
              printf '%s\n' "$cleared" | sed 's/^/ - /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$introduced" ]; then
            echo "::error::the rebuilt saiva-web carries findings the image it replaces"
            echo "::error::does not. The new base layer is worse than what the box runs;"
            echo "::error::not publishing it."
            printf '%s\n' "$introduced"
            exit 1
          fi
          echo "No finding in the candidate is absent from the image it replaces."
      # The Caddy boot steps that used to end this job are now image-smoke.yml; see the
      # `smoke` job below.

  # The same definition cut-release.yml calls, on the digests the jobs above pushed, so
  # one tree of assertions covers both the release path and the weekly refresh. It is
  # given digests rather than the `:refresh-candidate` tag because that tag is
  # overwritten by every run of this workflow: a concurrent run could move it between
  # the build and here, and the gate would then vouch for an image nobody promotes.
  #
  # `permissions:` is spelled out because a called workflow's token can only be narrower
  # than the caller's, and the workflow-level `contents: read` above leaves `packages` at
  # none — image-smoke.yml would be unable to pull what it is meant to boot. No
  # `secrets:` block: GITHUB_TOKEN reaches a called workflow anyway, and `secrets:
  # inherit` would hand it every other secret in the repository.
  #
  # No `expect_version` is passed, unlike cut-release.yml, and the asymmetry is on
  # purpose. That input asserts that the SAIVA_VERSION build-arg actually reached the
  # image, which needs `ARG SAIVA_VERSION` in the Dockerfile of the tree being built.
  # cut-release.yml builds the current tree, so the gate and the Dockerfile travel
  # together and a mismatch is a bug somebody just introduced. This workflow builds
  # whatever Dockerfile an older release tag happens to hold, and a release predating
  # that ARG would make the gate fail every Tuesday — which is the one failure this file
  # argues hardest against, twice, because a gate that can only fail silently stops
  # delivering the patches the workflow exists for. The discover job has already refused
  # to rebuild anything but a `vX.Y.Z` tag with a published Release.
  smoke:
    name: Smoke
    needs: [discover, api, web]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/image-smoke.yml
    with:
      api_image: ghcr.io/${{ github.repository_owner }}/saiva-api@${{ needs.api.outputs.digest }}
      web_image: ghcr.io/${{ github.repository_owner }}/saiva-web@${{ needs.web.outputs.digest }}

  promote:
    name: Point the release channel at the rebuilt images
    # Both images or neither, and only once both have booted. Promoting per-image would
    # leave api on refreshed layers and web on the release's whenever one of the two
    # smoke jobs failed, and `make pull` would then hand the box a mismatched pair.
    needs: [discover, api, web, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Which tags move, and why these and not the others:
      #
      #   latest         moves. It is a rolling pointer by definition and it is what
      #                  production follows, so not moving it means this workflow does
      #                  nothing.
      #   <major.minor>  moves. "0.16" means the newest 0.16.x build; a pin to it that
      #                  silently missed the patch while `latest` got it would be worse
      #                  than not offering the pin.
      #   v<ver>         does NOT move. A version tag that changes digest means
      #                  "pinned" does not mean pinned, and there is then no answer to
      #                  "which image is v0.16.0".
      #   sha-<short>    does NOT move, and this is the sharp one. The refresh rebuilds
      #                  the release's commit, so the short-SHA tag cut-release.yml
      #                  publishes names the ORIGINAL release build — the exact tag the
      #                  documented rollback uses (`SAIVA_VERSION=sha-<previous>` +
      #                  `make pull`). Writing it again would overwrite the known-good
      #                  image with the new one: the rollback deleting itself.
      #   <tag>-patch.<date>  is how a refreshed build is named, and it is also what
      #                  this run bakes in as SAIVA_BUILD — so a box can report which
      #                  rebuild it is running, and there is a pullable name for it.
      #
      # So `:latest` and `:v<ver>` are no longer the same digest. cut-release.yml used
      # to claim they could not drift; its comment has been corrected rather than left
      # to describe a pipeline that no longer exists.
      #
      # `imagetools create` re-tags by digest — no rebuild, no QEMU, and the per-
      # architecture manifests under the new tags are byte-identical to the ones the
      # jobs above pulled and the `smoke` job ran.
      - name: Promote the tested digests
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ needs.discover.outputs.tag }}
          MAJOR_MINOR: ${{ needs.discover.outputs.major_minor }}
          REBUILD_TAG: ${{ needs.discover.outputs.rebuild_tag }}
          API_DIGEST: ${{ needs.api.outputs.digest }}
          WEB_DIGEST: ${{ needs.web.outputs.digest }}
        run: |
          set -euo pipefail
          # Two statements, not `test -n "$A" && test -n "$B"`. `set -e` exempts every
          # command of an AND-OR list but the last, so an empty API_DIGEST would
          # short-circuit the list with status 0 and go on to call `imagetools create`
          # with a malformed `ghcr.io/owner/saiva-api@` source. Measured: only an empty
          # *second* operand aborts. An empty digest here means a build output went
          # missing, which is precisely when not publishing matters.
          test -n "$API_DIGEST"
          test -n "$WEB_DIGEST"
          promote() {
            docker buildx imagetools create \
              --tag "ghcr.io/$OWNER/$1:latest" \
              --tag "ghcr.io/$OWNER/$1:$MAJOR_MINOR" \
              --tag "ghcr.io/$OWNER/$1:$REBUILD_TAG" \
              "ghcr.io/$OWNER/$1@$2"
          }
          # Not atomic, and it cannot be: two repositories, two registry writes. If the
          # second fails, api has moved and web has not, which is the mismatched pair
          # the `needs: [discover, api, web]` gate above exists to avoid. So the
          # summary is written per image as each one lands, rather than once at the
          # end — on a half-done promote the log then says which half, instead of
          # saying nothing at all because the final block never ran.
          {
            echo "### Refreshed $TAG"
            echo
            echo "Same source tree, rebuilt base layers."
            echo
            echo "| image | digest | tags moved |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for pair in "saiva-api $API_DIGEST" "saiva-web $WEB_DIGEST"; do
            # shellcheck disable=SC2086
            set -- $pair
            promote "$1" "$2"
            # Read it back rather than assume the write landed. `imagetools create` is
            # a re-push of the source index bytes, so the tag must resolve to exactly
            # the digest the smoke jobs ran; if it does not, something else wrote this
            # tag between the gate and here and the run must not report success.
            live="$(docker buildx imagetools inspect \
              --format '{{.Manifest.Digest}}' "ghcr.io/$OWNER/$1:latest")"
            if [ "$live" != "$2" ]; then
              echo "::error::$1:latest resolves to $live, not the tested $2"
              exit 1
            fi
            echo "| $1 | \`$2\` | latest, $MAJOR_MINOR, $REBUILD_TAG |" \
              >> "$GITHUB_STEP_SUMMARY"
          done
          {
            echo
            echo "\`:$TAG\` and \`:sha-*\` still point at the original release build."
            echo
            echo "**Nothing on the box has pulled this.** There is no in-app button to"
            echo "press: the update badge compares release tags, this is the same tag,"
            echo "so the app reports \"You're on the latest version\" while running the"
            echo "old digest. Run \`make pull\` on the host to apply it."
          } >> "$GITHUB_STEP_SUMMARY"
