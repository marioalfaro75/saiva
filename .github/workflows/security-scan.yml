name: Security scan

# Semgrep (code patterns) and Trivy (dependency + container + IaC CVEs), reporting
# into the repository's Security tab rather than only into a log that scrolls past.
#
# Deliberately *not* in checks.yml: these scanners re-fetch their rule sets and the
# CVE database on every run, so their verdict on an unchanged commit changes over
# time. Gating a release on that means a tag that built on Tuesday fails on
# Wednesday for a reason nobody introduced. They run on every PR and weekly, and
# the weekly run is the point — it finds the CVE published after the code merged.
on:
  push:
    # Feature branches too, not only main: a scanner nobody has watched run is
    # indistinguishable from one that is silently broken, and the point of finding
    # something is to find it before it merges.
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1"   # Mondays, 06:27 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan
        # Explicit rule packs rather than `--config=auto`, which needs an account
        # and silently scans with nothing when the token is absent. `--text` as well
        # as SARIF: with SARIF alone the log said "3 findings" and not one word about
        # what they were, which is a scan you cannot act on without leaving the page.
        run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/python \
            --config=p/typescript \
            --config=p/react \
            --config=p/dockerfile \
            --text --sarif-output=semgrep.sarif \
            --metrics=off \
            --exclude=node_modules --exclude=dist --exclude='*.lock'
      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@a45bef097606dca6eac8285c279babedd70e6dfd # v3.37.9
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trivy:
    name: Trivy (dependencies, IaC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Reads requirements.lock and package-lock.json — the resolved versions that
      # actually ship, not the ranges in the manifests.
      - name: Dependency CVEs
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scanners: vuln,secret
          format: sarif
          output: trivy-deps.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
      - name: Upload dependency findings
        if: always()
        uses: github/codeql-action/upload-sarif@a45bef097606dca6eac8285c279babedd70e6dfd # v3.37.9
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-dependencies

      - name: Findings, readable
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scanners: vuln,secret
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      # Dockerfile and compose misconfiguration: root containers, missing user,
      # published ports, writable filesystems.
      - name: Infrastructure misconfiguration
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: config
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH
      - name: Upload misconfiguration findings
        if: always()
        uses: github/codeql-action/upload-sarif@a45bef097606dca6eac8285c279babedd70e6dfd # v3.37.9
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      # An inventory of what actually shipped, so the next advisory can be answered
      # with "yes, version X, in these images" rather than by reading Dockerfiles.
      - name: Software bill of materials
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          format: cyclonedx
          output: saiva-sbom.cdx.json
          scanners: license
      - name: Keep the SBOM with the run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: saiva-sbom.cdx.json
          retention-days: 90

  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [backend/Dockerfile, frontend/Dockerfile]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: hadolint ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: error

  # Whether this pull request changes what actually goes into an image. Same
  # paths-filter idiom ci.yml uses to decide which image to republish.
  #
  # Deliberately not `backend/app/**`: that would rebuild both images on nearly every
  # backend pull request to re-scan an unchanged dependency set. The risk it would
  # cover — app code starting to import something the API image no longer ships, now
  # that backend/Dockerfile strips pip and setuptools — is covered at the source
  # instead, by test_no_runtime_module_imports_the_packaging_toolchain in
  # backend/tests/test_supply_chain.py, which runs in the blocking suite every time.
  image-inputs:
    name: Detect image changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            images:
              - 'backend/Dockerfile'
              - 'frontend/Dockerfile'
              - 'backend/requirements.lock'
              - 'backend/pyproject.toml'
              - 'frontend/package-lock.json'
              - '.github/workflows/security-scan.yml'

  images:
    name: Base image CVEs (${{ matrix.image }})
    # The gap the other Trivy job leaves. `scan-type: fs` reads requirements.lock,
    # package-lock.json and the Dockerfiles — it never looks inside a built image, so
    # the OS packages in python:3.11-slim-bookworm and caddy:2-alpine were outside
    # everything this repo scanned. That is also the hole the base-image ignore rules
    # in .github/dependabot.yml rely on this job to cover.
    #
    # Built here rather than pulled from GHCR: no registry credentials to hold, and it
    # scans the images this commit would produce rather than the last ones published.
    #
    # Always on main and on the weekly run — a base image's CVEs change when its
    # publisher rebuilds it, not when a branch does. On a pull request only when the
    # branch changes what goes into an image, which keeps ordinary reviews fast while
    # still rebuilding when a Dockerfile, a lockfile or this workflow itself moves.
    # That last path matters: it is what makes a change to this job self-testing
    # rather than something whose first real run is on main.
    needs: [image-inputs]
    if: >-
      always() && (
        github.event_name != 'pull_request' ||
        needs.image-inputs.outputs.changed == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      # One image failing to build should not hide the other's findings.
      fail-fast: false
      matrix:
        include:
          - { image: saiva-api, context: ./backend }
          - { image: saiva-web, context: ./frontend }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build ${{ matrix.image }} locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          # Native arch only, loaded into the daemon rather than pushed. The OS
          # packages are the same on both architectures, so emulating arm64 here
          # would double the runtime to rescan the same CVEs.
          load: true
          push: false
          tags: ${{ matrix.image }}:scan
          cache-from: type=gha
      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:scan
          scanners: vuln
          format: sarif
          output: trivy-image.sarif
          # Kept for the day `limit-severities-for-sarif` is wanted, but inert as
          # written: trivy-action's entrypoint unsets TRIVY_SEVERITY for sarif
          # output unless that input is "true", so this SARIF already carries every
          # severity. Narrowing it is a separate decision about what the Security
          # tab should hold, not a side effect of the step below.
          severity: CRITICAL,HIGH,MEDIUM
          # A base image usually carries CVEs with no fix published yet. Reporting
          # those into the Security tab trains people to ignore the whole category,
          # so what gets filed as a finding is what could actually be acted on. The
          # cost is that a package Debian LTS has dropped is also filtered out —
          # Trivy calls that StatusEndOfLife and `ignore-unfixed` discards every
          # status but Fixed — so the step below prints the other half.
          ignore-unfixed: true
      - name: Findings, readable — including the ones with no fix
        # The same image with `ignore-unfixed` off, as a table and not as SARIF:
        # this number belongs in the log beside the one above, not in the Security
        # tab where it would bury the actionable findings. Two numbers side by side
        # are the point — "0 fixable, 37 unfixed" says something about the base
        # image that neither says alone, and the ratio is what moves at end of
        # life. It was `true` here as well until Debian handed bookworm to the LTS
        # team in mid-2026 (the announcement, debian.org/News/2026/20260712, is
        # dated 2026-07-12; debian.org's release table carries 2026-07-11 with the
        # final point release 12.15; the schedule published in 2024 said
        # 2026-06-10 — four months ago whichever you take), at which point "no fix
        # available" stopped meaning "not triaged yet" for the part of the image
        # LTS excludes.
        #
        # UNKNOWN is on the severity list deliberately. Debian's tracker records
        # state and urgency in separate fields and trivy-db reads them separately
        # (`newStatus(adv.State)`, `severityFromUrgency(adv.Severity)`), so an
        # entry whose urgency is itself "end-of-life" lands as severity UNKNOWN —
        # exactly the rows this step exists to show, and CRITICAL,HIGH,MEDIUM
        # alone would drop them.
        #
        # Two things not to read into this. `ignore-unfixed: false` is also
        # trivy-action's own default, so the input is never exported and this line
        # records intent rather than enforcing it; a trivy.yaml or a
        # TRIVY_IGNORE_UNFIXED would silently win and no test here would notice.
        # And "non-blocking" means findings: `exit-code` is unset on both steps so
        # Trivy exits 0 however much it finds, but a scan *error* does fail the job
        # (entrypoint.sh runs under `set -euo pipefail`), which is correct. The
        # deliberate part is the absence of a threshold — gating on a CVE count
        # would make an unchanged commit start failing the day a database updates,
        # which is why this whole workflow sits outside checks.yml.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:scan
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH,MEDIUM,UNKNOWN
          ignore-unfixed: false
      - name: Upload ${{ matrix.image }} findings
        if: always()
        uses: github/codeql-action/upload-sarif@a45bef097606dca6eac8285c279babedd70e6dfd # v3.37.9
        with:
          sarif_file: trivy-image.sarif
          # Distinct per image, or the second upload replaces the first.
          category: trivy-image-${{ matrix.image }}
