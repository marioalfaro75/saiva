name: Release

# Publishes the api + web images to GitHub Container Registry (ghcr.io) on a
# version tag (e.g. `git tag v0.4.0 && git push --tags`), or on manual dispatch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (manual runs), e.g. edge"
        required: false
        default: edge

permissions:
  contents: read
  packages: write

# This workflow writes `:latest` without ever naming it: docker/metadata-action
# generates it by default in `auto` mode for `type=semver`, which the `meta` step
# below uses. That makes this the third writer of the release channel, alongside
# cut-release.yml and refresh-images.yml, and it was the only one not serialised —
# so a `v*` tag pushed by hand while a refresh was promoting could interleave two
# writers on the same tag. Same group as the other two, and never cancel: the images
# are published before anything else happens, so a cancelled run leaves the channel
# half-written.
concurrency:
  group: ghcr-release-channel
  cancel-in-progress: false

jobs:
  # A version tag used to publish straight to `:latest`. Anyone who could push a
  # tag could ship an image that had never run a test — the edge channel was gated
  # and the release channel, the one users actually pull, was not.
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { image: saiva-api, context: ./backend }
          - { image: saiva-web, context: ./frontend }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v3       # enables linux/arm64 builds
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          build-args: |
            SAIVA_VERSION=${{ steps.meta.outputs.version }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
