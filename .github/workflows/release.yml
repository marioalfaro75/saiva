name: Hand-pushed tag (not a release path)

# This workflow used to build and publish `:latest` from any `v*` tag anyone pushed.
# It no longer publishes anything. It exists to say so out loud.
#
# What it was, and why that was wrong. It ran docker/metadata-action with
# `type=semver`, which in its default `auto` mode generates `:latest` as well — so this
# workflow moved the tag production follows without the string "latest" appearing
# anywhere in it. It created no GitHub Release, and there was never a step in it that
# could have: the in-app update badge reads GitHub *Releases*
# (backend/app/services/updates.py, `fetch_latest_release`), not tags. So a hand-pushed
# tag shipped a new image to every box on `:latest` with no release notes, nothing in
# the app to say an update had happened, and no record a human had decided to ship it.
# cut-release.yml does the same job with the steps that make it a release: validate the
# version, run the shared checks, publish the images, smoke-test them, promote the
# rolling tags, then create the tag and the GitHub Release.
#
# Deleted outright, or kept as this? Kept, and the reason is the failure mode. Delete
# the workflow and pushing `v0.17.0` by hand becomes a silent no-op: the tag exists,
# no image is built, `:latest` still serves the old release, no Release record appears,
# and the person who pushed it has every reason to believe they shipped. That is the
# same shape as the bug this file used to be — a pipeline that looks like it worked —
# and it is the shape that costs the most to discover later. A workflow that fails
# loudly turns it into a red run in the Actions tab, a notification, and instructions.
# The cost of keeping it is one near-instant failed run per hand-pushed tag.
#
# No `concurrency` group here, deliberately. cut-release.yml and refresh-images.yml
# share `ghcr-release-channel` because they both write the rolling release tags and
# must not interleave. This workflow writes nothing, so joining that group would only
# let a stray tag push queue ahead of a real release.
on:
  push:
    tags: ["v*"]

# Nothing is read and nothing is written. The old `packages: write` is exactly what
# this file should no longer hold.
permissions: {}

jobs:
  refuse:
    name: Refuse to publish from a tag push
    runs-on: ubuntu-latest
    steps:
      - name: Explain what did not happen, and what to do instead
        env:
          TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          # Via env rather than interpolated into the script: a ref name is attacker-
          # controllable in the general case, and an expression interpolated into a
          # `run:` block is textual substitution into the shell, quoting and all.
          {
            echo "## \`$TAG\` was pushed, and nothing was published"
            echo
            echo "No image was built. \`:latest\` still points where it did, and no"
            echo "GitHub Release was created — so the in-app update check, which reads"
            echo "Releases rather than tags, has not noticed this tag and never will."
            echo
            echo "To release $TAG properly:"
            echo
            echo "1. Delete the tag, locally and on the remote:"
            echo "   \`git tag -d $TAG && git push --delete origin $TAG\`"
            echo "2. Run **Actions -> Cut release -> Run workflow** and enter the version"
            echo "   without the \`v\` (for \`$TAG\`, enter \`${TAG#v}\`)."
            echo
            echo "Cut release validates the version, runs the full checks, publishes both"
            echo "images, boots them to prove they work, moves \`:latest\` onto the tested"
            echo "digests and then creates the tag and the Release — in that order, so a"
            echo "release that cannot start never reaches the house and a Release never"
            echo "exists without an image behind it."
            echo
            echo "<$REPO_URL/actions/workflows/cut-release.yml>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$TAG was pushed by hand. This repository does not publish from"
          echo "::error::tag pushes: a tag reaches every box on :latest with no release"
          echo "::error::notes and no update badge. Delete the tag and run the Cut"
          echo "::error::release workflow instead. See this run's summary for the exact"
          echo "::error::commands."
          exit 1
