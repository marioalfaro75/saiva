version: 2

# Every place this repo pins a dependency. Left off the list, something simply never
# gets a security update — which is how a pin ends up three years and one advisory
# behind without anyone deciding that.
#
# The grouping is not cosmetic. The first week this file existed it opened eleven pull
# requests, and a list nobody reads is the same as no list. Routine churn arrives as
# one pull request per ecosystem; a major, which needs a human to think, arrives as
# its own batch.
#
# Note on what grouping does NOT cover: `groups` defaults to `applies-to:
# version-updates`, so a *security* update still arrives as its own pull request per
# advisory. That is left alone on purpose — an advisory is exactly the thing that
# should not be buried in a batch of seven routine bumps.
updates:
  # ---------------------------------------------------------------- workflows
  # Keeps the SHA pins in .github/workflows fresh. Dependabot understands a
  # `uses: owner/action@<sha> # v4` pin and updates the SHA *and* the comment, so
  # pinning does not mean going stale.
  #
  # The limit is 10 rather than 5 because five were already open and saturated when
  # this was written: at the limit Dependabot opens nothing new, so a regrouping
  # cannot take effect until someone clears the backlog.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
      # Majors batched rather than one branch each: a new major of gitleaks or
      # setup-python can change a workflow's behaviour, and they are easier to judge
      # side by side.
      actions-major:
        update-types: ["major"]

  # ----------------------------------------------------------------- frontend
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
      # react 18 to 19, recharts 2 to 3 and jest-dom 6 to 7 all arrived as separate
      # pull requests in one week. Each needs reading; none needs its own branch.
      npm-major:
        update-types: ["major"]

  # ------------------------------------------------------------------ backend
  # pyproject.toml declares ranges, so most releases need no pull request at all.
  # What this does catch is a release outside a range — including the deliberate
  # upper caps, which Dependabot offers to widen (it has proposed <2.1 to <2.2 for
  # sqlalchemy and <0.142 to <0.163 for fastapi). Those are judgement calls and worth
  # seeing.
  #
  # What it does NOT catch: requirements.lock. Dependabot's pip fetcher recognises
  # requirements*.txt, *.in, setup.py/cfg, pyproject.toml, Pipfile and poetry.lock —
  # a file named `.lock` that is none of those is invisible to it, so the ~30
  # transitive pins in there get no pull requests. The control for those is
  # `pip-audit --strict -r requirements.lock`, which is a blocking step in
  # checks.yml, and which is what actually caught thirteen pyjwt advisories.
  #
  # Nor does merging a widened cap fail CI by itself: scripts/check_lockfile.py only
  # asserts the lock still satisfies pyproject, and a wider range is still satisfied
  # by the pinned version. Regenerating the lock is a deliberate follow-up, not
  # something CI forces.
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-all:
        patterns: ["*"]

  # --------------------------------------------------- Dockerfile base images
  # No automatic version bumps. Not "patch only" — that would describe a narrowing
  # that cannot exist, because none of these tags carries a patch component:
  # `python:3.11-slim-bookworm` is major.minor, `node:22-alpine` and `caddy:2-alpine`
  # are major only, and Dependabot preserves a tag's precision. Ignoring major and
  # minor therefore silences these entries completely, and the honest thing is to say
  # so rather than imply a trickle still gets through.
  #
  # Why silence them: the runtimes here are coupled to the versions CI tests against
  # (checks.yml pins python 3.11 and node 22). A bump to the image alone ships a
  # runtime nothing tested — Dependabot offered python 3.15 and node 26 while CI
  # stayed on 3.11 and 22 — and it cannot see that coupling. Changing a runtime is a
  # deliberate, multi-file change.
  #
  # What covers them instead, and the honest limits of it.
  #
  # These are *mutable* tags: their publishers rebuild them with OS patches, so a patched
  # base layer needs no pull request at all. It arrives on the next image build. The catch
  # is which build reaches the house. Watchtower pulls `:latest`, and `:latest` is written
  # only by cut-release.yml, which is workflow_dispatch -- a human deciding to release.
  # ci.yml publishes `edge`, which production does not follow, and the weekly `images` job
  # in security-scan.yml builds with `push: false` and discards the image after scanning
  # it. So an OS patch reaches the deployed container when someone cuts a release, not
  # weekly: v0.15.0 and v0.16.0 are 57 days apart, and for those 57 days the box ran one
  # unchanged OS layer. An earlier version of this comment said patches "arrive on the next
  # image build" and stopped there, which read as though that happened on its own.
  #
  # The `images` job is still the only thing in this repo that looks inside a built image,
  # and it is what these ignore rules lean on. Two blind spots in it are worth writing down
  # rather than rediscovering:
  #
  #   - The SARIF it files runs with `ignore-unfixed: true`. That is right for routine
  #     noise and exactly wrong for an end-of-life base image: once a distro stops
  #     publishing fixes, every CVE it carries becomes unfixed, so the filed findings fall
  #     silent at the moment the image stops being maintained — a package Debian LTS has
  #     dropped is `StatusEndOfLife` to Trivy, and `ignore-unfixed` discards every status
  #     but Fixed. Quiet from that job is not the same as safe. The job's readable table
  #     now prints the unfixed count too, so the two numbers sit side by side in the log;
  #     neither step fails the job on what it finds.
  #   - Silencing python and node here removed the only thing that ever mentioned a newer
  #     runtime. What says it now is backend/tests/test_runtime_support_window.py, which
  #     reads the versions out of the two Dockerfiles and docker-compose.prod.yml and
  #     goes red a chosen number of months before each one's security fixes stop. It is the only
  #     time-dependent test in the suite, and the only thing anywhere in the repo that
  #     will ever volunteer "3.11 is approaching end of life".
  - package-ecosystem: docker
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "caddy"
        update-types: ["version-update:semver-major"]

  # ------------------------------------------------------- compose-file images
  # The images the compose files pin, which the two entries above do not reach: they
  # list /backend and /frontend, and the compose files live at the root.
  #
  # This matters most for `tecnativa/docker-socket-proxy:0.3.0`. It is the only fully
  # immutable pin in the repo — major.minor.patch, so no publisher rebuild will ever
  # move it — and it is the container holding a line to the Docker socket. It was
  # getting no updates from anywhere.
  #
  # Not ignored the way the base images are: nothing couples these to the CI matrix,
  # so there is no reason to silence them.
  #
  # Merging one of these does not update the running container, though. Watchtower is in
  # label-enable mode and only `api` and `web` carry the label, so caddy, postgres and the
  # socket proxy change only when someone runs `docker compose up -d` on the host. For
  # caddy that is the internet-facing TLS terminator, and for postgres it is the container
  # holding the actual records -- neither is updated by anything automatic today.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compose-images:
        patterns: ["*"]
